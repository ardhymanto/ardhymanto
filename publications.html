<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publications</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    line-height:1.6;
    background:#f5f5f5;
    color:#333;
}

header{
    background:#12314e;
    color:white;
    text-align:left;
    padding:50px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
    flex:1;
}

.header-icons{
    display:flex;
    gap:15px;
}

.header-icons a{
    display:inline-block;
}

.header-icons img{
    width:50px;
    height:50px;
    object-fit:contain;
    background:rgba(255, 255, 255, 0.1);
    padding:8px;
    border-radius:8px;
    transition:0.3s;
}

.header-icons img:hover{
    transform:scale(1.1);
    background:rgba(255, 255, 255, 0.2);
}

nav{
    background:#012a50;
    padding:12px;
    text-align:right;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:30px 0;
}

.card{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* Modernized Filter & Search Layout */
.filter-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin: 20px 0 10px 0;
    flex-wrap: wrap;
}

.search-box {
    flex: 1;
    min-width: 280px;
}

.search-box input {
    width: 100%;
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    transition: all 0.3s;
}

.search-box input:focus {
    border-color: #12314e;
    box-shadow: 0 0 0 3px rgba(18, 49, 78, 0.1);
    outline: none;
}

.filter-box {
    display: flex;
    align-items: center;
    gap: 10px;
}

#yearFilter {
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
    cursor: pointer;
}

.pub-count {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 15px;
    font-weight: 600;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top: 5px;
}

th{
    background:#12314e;
    color:white;
    padding:14px 12px;
    text-align:left;
    user-select: none;
}

th.sortable:hover {
    background: #012a50;
}

.sort-icon {
    font-size: 0.75rem;
    margin-left: 5px;
    opacity: 0.6;
}

td{
    padding:14px 12px;
    border-bottom:1px solid #ddd;
    font-size: 0.95rem;
    vertical-align: middle;
}

/* Custom limits for SCImago badge elements */
td img {
    max-height: 55px;
    display: block;
}

tr:nth-child(even){
    background:#f8f8f8;
}

tr:hover{
    background:#eef5fb;
}

.loading{
    text-align:center;
    padding: 30px !important;
    font-weight: bold;
    color: #555;
}

/* Styled URL/Link Badge */
.view-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    background: #e9eff8;
    color: #12314e;
    text-decoration: none;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
}

.view-link:hover {
    background: #12314e;
    color: white;
}

footer{
    margin-top:40px;
    background:#1f4e79;
    color:white;
    text-align:center;
    padding:20px;
}

.sinta-profile{
    background:white;
    padding:24px;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    margin-bottom:24px;
    border-left:5px solid #12314e;
}

.sinta-profile h3{
    margin-top:0;
    color:#12314e;
    font-size:1.8rem;
    font-weight:bold;
}

.sinta-id{
    background:#f0f4f8;
    padding:12px 16px;
    border-radius:8px;
    font-size:0.95rem;
    margin:1rem 0;
    color:#333;
}

.sinta-affiliation{
    color:#555;
    margin:0.5rem 0 1rem;
    line-height:1.8;
    font-size:1rem;
}

.sinta-affiliation strong{
    color:#12314e;
    display:block;
    margin-top:0.5rem;
    font-weight:600;
}

.sinta-affiliation a{
    color:#12314e;
    text-decoration:none;
    font-weight:500;
}

.sinta-affiliation a:hover{
    text-decoration:underline;
}

.sinta-metrics{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
    margin-top:1.5rem;
}

.metric-item{
    background:#e9eff8;
    color:#12314e;
    padding:16px;
    border-radius:12px;
    text-align:center;
    border-top:3px solid #12314e;
    transition:all 0.3s ease;
}

.metric-item:hover{
    box-shadow:0 4px 12px rgba(18, 49, 78, 0.15);
    transform:translateY(-2px);
}

.metric-item .metric-label{
    display:block;
    font-size:0.8rem;
    opacity:.8;
    margin-bottom:0.6rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
}

.metric-item .metric-value{
    font-size:2rem;
    font-weight:700;
    color:#020481;
}

/* Redesigned Compact Style for Index Matrices (Matching SINTA exactly) */
.index-matrices-section {
    margin-top: 1.5rem;
}

.index-matrices-title {
    margin-bottom: 0.6rem;
    font-weight: 600;
    color: #12314e;
}

.index-matrices-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
}

.index-metric-card {
    background: #e9eff8;
    color: #12314e;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    border-top: 3px solid #12314e;
    transition: all 0.3s ease;
    text-decoration: none;
    display: block;
}

.index-metric-card:hover {
    box-shadow: 0 4px 12px rgba(18, 49, 78, 0.15);
    transform: translateY(-2px);
}

.index-metric-card h3 {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    opacity: .8;
    line-height: 1.2;
}

.index-metric-card p {
    margin: 10px 0 0;
    font-size: 2rem;
    font-weight: 700;
    color: #020481;
}

.sinta-link{
    display:inline-block;
    margin-top:1.5rem;
    padding:0.85rem 1.5rem;
    background:#12314e;
    color:white;
    border-radius:8px;
    text-decoration:none;
    transition:all .3s ease;
    font-weight:600;
}

.sinta-link:hover{
    transform:translateY(-2px);
    background:#0d243f;
    box-shadow:0 4px 12px rgba(18, 49, 78, 0.25);
}
