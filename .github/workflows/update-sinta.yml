name: Update SINTA Profile

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note for this update run'
        required: false

jobs:
  update-sinta:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sinta-scraper requests beautifulsoup4
      
      - name: Run SINTA update script
        run: python update_sinta.py
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Commit and push changes
        run: |
          git add publications.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update SINTA profile data" && git push)
